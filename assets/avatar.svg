<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1A3352"/>
      <stop offset="0.55" stop-color="#0F1E33"/>
      <stop offset="1" stop-color="#091322"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6CD6B"/>
      <stop offset="0.5" stop-color="#E5A93A"/>
      <stop offset="1" stop-color="#C98B22"/>
    </linearGradient>
    <!-- low-contrast chevron weave, nod to Southern African basketry -->
    <pattern id="weave" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 12 L16 4 L32 12 M0 28 L16 20 L32 28" fill="none" stroke="#F6CD6B" stroke-width="1.6" stroke-linejoin="round"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="edge">
      <rect width="512" height="512" fill="url(#fade)"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#weave)" opacity="0.10" mask="url(#edge)"/>

  <!-- framing ring, sits inside GitHub's circular crop -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#E5A93A" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#E5A93A" stroke-opacity="0.12" stroke-width="1"/>

  <!-- soft glow behind the lead node -->
  <circle cx="340" cy="164" r="34" fill="#F6CD6B" opacity="0.45" filter="url(#glow)"/>

  <!-- N as a small network: four nodes, three links -->
  <g stroke="url(#gold)" stroke-width="28" stroke-linecap="round" fill="none">
    <line x1="172" y1="314" x2="172" y2="198"/>
    <line x1="194" y1="190" x2="318" y2="322"/>
    <line x1="340" y1="314" x2="340" y2="198"/>
  </g>
  <g fill="#0F1E33" stroke="url(#gold)" stroke-width="12">
    <circle cx="172" cy="348" r="24"/>
    <circle cx="172" cy="164" r="24"/>
    <circle cx="340" cy="348" r="24"/>
  </g>
  <!-- lead node: solid, slightly larger -->
  <circle cx="340" cy="164" r="30" fill="url(#gold)"/>
  <circle cx="340" cy="164" r="10" fill="#0F1E33"/>
</svg>
